<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f1ea);
    --text: var(--tg-theme-text-color, #1c1f1d);
    --hint: var(--tg-theme-hint-color, #7a8783);
    --section-bg: var(--tg-theme-secondary-bg-color, #ffffff);
    --accent: #1f6d4a;
    --accent-text: #ffffff;
    --border: #e2e0d6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 90px;
  }

  header {
    padding: 18px 16px 12px;
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: var(--hint);
    font-size: 14px;
  }

  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 14px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--section-bg);
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .cat-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px;
  }

  .card {
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: var(--border);
  }

  .card-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-price {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }

  .card-actions {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .add-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: var(--bg);
    border-radius: 8px;
    padding: 4px;
  }

  .stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  .stepper span {
    font-weight: 700;
    font-size: 14px;
  }

  .empty {
    text-align: center;
    color: var(--hint);
    padding: 40px 20px;
  }

  /* Savat paneli */
  .cart-bar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 12px;
    padding: 14px 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 10;
  }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    max-height: 85vh;
    overflow-y: auto;
    z-index: 11;
    display: none;
    padding: 18px 16px 24px;
  }

  .sheet h2 {
    margin: 0 0 14px;
    font-size: 18px;
  }

  .cart-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .cart-line-name {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }

  .cart-line-price {
    font-size: 13px;
    color: var(--hint);
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 0;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
  }

  input[type=text], input[type=tel] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--section-bg);
    color: var(--text);
    font-size: 14px;
  }

  .pay-options {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .pay-chip {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--section-bg);
    font-size: 13px;
    cursor: pointer;
  }

  .pay-chip.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }

  .checkout-btn {
    width: 100%;
    margin-top: 18px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .close-sheet {
    position: absolute;
    right: 16px;
    top: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--hint);
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Do'kon</h1>
  <p>Mahsulotni tanlang va savatga qo'shing</p>
</header>

<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>

<div class="cart-bar" id="cartBar">
  <span id="cartBarText">Savat</span>
  <span id="cartBarTotal"></span>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="cartSheet">
  <button class="close-sheet" id="closeCart">✕</button>
  <h2>Savat</h2>
  <div id="cartLines"></div>
  <div class="total-row"><span>Jami</span><span id="cartTotal">0 so'm</span></div>
  <button class="checkout-btn" id="goCheckout">Buyurtma berish</button>
</div>

<div class="sheet" id="checkoutSheet">
  <button class="close-sheet" id="closeCheckout">✕</button>
  <h2>Yetkazib berish ma'lumotlari</h2>

  <label>Ismingiz</label>
  <input type="text" id="custName" placeholder="Ism Familiya">

  <label>Telefon raqam</label>
  <input type="tel" id="custPhone" placeholder="+998 90 123 45 67">

  <label>Manzil</label>
  <input type="text" id="custAddress" placeholder="Shahar, tuman, ko'cha, uy">

  <label>To'lov turi</label>
  <div class="pay-options">
    <div class="pay-chip active" data-pay="naqd">Naqd</div>
    <div class="pay-chip" data-pay="payme">Payme</div>
    <div class="pay-chip" data-pay="click">Click</div>
  </div>

  <div class="total-row"><span>Jami</span><span id="checkoutTotal">0 so'm</span></div>
  <button class="checkout-btn" id="submitOrder">Buyurtmani tasdiqlash</button>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Bot ishga tushirilgandagi API manzilini shu yerga qo'ying
  // (masalan: https://sizning-loyihangiz.up.railway.app)
  const API_URL = "telegramshop-production-a74b.up.railway.app";

  let products = [];
  let cart = JSON.parse(localStorage.getItem("cart") || "{}");
  let activeCategory = "Barchasi";
  let activePayment = "naqd";

  const gridEl = document.getElementById("grid");
  const categoriesEl = document.getElementById("categories");
  const cartBar = document.getElementById("cartBar");
  const overlay = document.getElementById("overlay");
  const cartSheet = document.getElementById("cartSheet");
  const checkoutSheet = document.getElementById("checkoutSheet");

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function money(n) {
    return n.toLocaleString("uz-UZ") + " so'm";
  }

  async function loadProducts() {
    try {
      const res = await fetch(API_URL + "/products");
      products = await res.json();
    } catch (e) {
      gridEl.innerHTML = '<div class="empty">Mahsulotlarni yuklab bo\'lmadi.<br>API_URL to\'g\'ri sozlanganini tekshiring.</div>';
      return;
    }
    renderCategories();
    renderGrid();
    updateCartBar();
  }

  function renderCategories() {
    const cats = ["Barchasi", ...new Set(products.map(p => p.category || "Umumiy"))];
    categoriesEl.innerHTML = cats.map(c =>
      `<div class="cat-chip ${c === activeCategory ? "active" : ""}" data-cat="${c}">${c}</div>`
    ).join("");
    categoriesEl.querySelectorAll(".cat-chip").forEach(chip => {
      chip.onclick = () => {
        activeCategory = chip.dataset.cat;
        renderCategories();
        renderGrid();
      };
    });
  }

  function renderGrid() {
    const list = activeCategory === "Barchasi"
      ? products
      : products.filter(p => (p.category || "Umumiy") === activeCategory);

    if (list.length === 0) {
      gridEl.innerHTML = '<div class="empty">Bu turkumda mahsulot yo\'q</div>';
      return;
    }

    gridEl.innerHTML = list.map(p => {
      const qty = cart[p.id]?.qty || 0;
      return `
        <div class="card">
          <img src="${p.photo}" alt="${p.name}" loading="lazy">
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <div class="card-price">${money(p.price)}</div>
            <div class="card-actions">
              ${qty === 0
                ? `<button class="add-btn" data-id="${p.id}">Savatga</button>`
                : `<div class="stepper">
                     <button data-id="${p.id}" data-action="minus">−</button>
                     <span>${qty}</span>
                     <button data-id="${p.id}" data-action="plus">+</button>
                   </div>`
              }
            </div>
          </div>
        </div>
      `;
    }).join("");

    gridEl.querySelectorAll(".add-btn").forEach(btn => {
      btn.onclick = () => changeQty(btn.dataset.id, 1);
    });
    gridEl.querySelectorAll(".stepper button").forEach(btn => {
      btn.onclick = () => changeQty(btn.dataset.id, btn.dataset.action === "plus" ? 1 : -1);
    });
  }

  function changeQty(id, delta) {
    const product = products.find(p => String(p.id) === String(id));
    if (!product) return;
    const current = cart[id]?.qty || 0;
    const next = current + delta;
    if (next <= 0) {
      delete cart[id];
    } else {
      cart[id] = { qty: next, name: product.name, price: product.price };
    }
    saveCart();
    renderGrid();
    updateCartBar();
  }

  function cartTotal() {
    return Object.values(cart).reduce((sum, i) => sum + i.qty * i.price, 0);
  }

  function cartCount() {
    return Object.values(cart).reduce((sum, i) => sum + i.qty, 0);
  }

  function updateCartBar() {
    const count = cartCount();
    if (count === 0) {
      cartBar.style.display = "none";
      return;
    }
    cartBar.style.display = "flex";
    document.getElementById("cartBarText").textContent = `Savat (${count})`;
    document.getElementById("cartBarTotal").textContent = money(cartTotal());
  }

  function openSheet(sheet) {
    overlay.style.display = "block";
    sheet.style.display = "block";
  }
  function closeSheets() {
    overlay.style.display = "none";
    cartSheet.style.display = "none";
    checkoutSheet.style.display = "none";
  }

  cartBar.onclick = () => {
    renderCartLines();
    openSheet(cartSheet);
  };
  overlay.onclick = closeSheets;
  document.getElementById("closeCart").onclick = closeSheets;
  document.getElementById("closeCheckout").onclick = closeSheets;

  function renderCartLines() {
    const lines = Object.entries(cart);
    document.getElementById("cartLines").innerHTML = lines.map(([id, item]) => `
      <div class="cart-line">
        <div class="cart-line-name">${item.name} <span class="cart-line-price">x${item.qty}</span></div>
        <div>${money(item.qty * item.price)}</div>
      </div>
    `).join("");
    document.getElementById("cartTotal").textContent = money(cartTotal());
  }

  document.getElementById("goCheckout").onclick = () => {
    document.getElementById("checkoutTotal").textContent = money(cartTotal());
    cartSheet.style.display = "none";
    openSheet(checkoutSheet);
  };

  document.querySelectorAll(".pay-chip").forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll(".pay-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activePayment = chip.dataset.pay;
    };
  });

  document.getElementById("submitOrder").onclick = () => {
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();

    if (!name || !phone || !address) {
      alert("Iltimos, barcha maydonlarni to'ldiring.");
      return;
    }
    if (cartCount() === 0) {
      alert("Savat bo'sh.");
      return;
    }

    const payload = {
      items: Object.values(cart),
      customer: { name, phone, address },
      payment: activePayment,
      total: cartTotal(),
    };

    if (tg) {
      tg.sendData(JSON.stringify(payload));
      cart = {};
      saveCart();
    } else {
      alert("Bu sahifa faqat Telegram ichida to'liq ishlaydi.");
    }
  };

  loadProducts();
</script>

</body>
</html>
