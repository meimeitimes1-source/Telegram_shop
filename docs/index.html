<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mei Mei Times</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f4f1ea);
    --text: var(--tg-theme-text-color, #1c1f1d);
    --hint: var(--tg-theme-hint-color, #7a8783);
    --section-bg: var(--tg-theme-secondary-bg-color, #ffffff);
    --accent: #1f6d4a;
    --accent-text: #ffffff;
    --border: #e2e0d6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 90px;
  }

  header {
    padding: 18px 16px 12px;
  }

  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: var(--hint);
    font-size: 14px;
  }

  .categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 16px 14px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .categories::-webkit-scrollbar { display: none; }

  .cat-chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--section-bg);
    color: var(--text);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .cat-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px;
  }

  .card {
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: var(--border);
  }

  .card-body {
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-price {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
  }

  .card-actions {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .add-btn {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: var(--bg);
    border-radius: 8px;
    padding: 4px;
  }

  .stepper button {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  .stepper span {
    font-weight: 700;
    font-size: 14px;
  }

  .empty {
    text-align: center;
    color: var(--hint);
    padding: 40px 20px;
  }

  /* Savat paneli */
  .cart-bar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 12px;
    padding: 14px 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    z-index: 10;
  }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    max-height: 85vh;
    overflow-y: auto;
    z-index: 11;
    display: none;
    padding: 18px 16px 24px;
  }

  .sheet h2 {
    margin: 0 0 14px;
    font-size: 18px;
  }

  .cart-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .cart-line-name {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }

  .cart-line-price {
    font-size: 13px;
    color: var(--hint);
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 0;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 12px 0 6px;
  }

  input[type=text], input[type=tel] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--section-bg);
    color: var(--text);
    font-size: 14px;
  }

  .pay-options {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }

  .pay-chip {
    flex: 1;
    text-align: center;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--section-bg);
    font-size: 13px;
    cursor: pointer;
  }

  .pay-chip.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }

  .checkout-btn {
    width: 100%;
    margin-top: 18px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .close-sheet {
    position: absolute;
    right: 16px;
    top: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--hint);
    cursor: pointer;
  }

  .brand{display:flex;align-items:center;gap:10px}.brand-logo{width:42px;height:42px;border-radius:12px;background:#1f6d4a;color:#fff;display:grid;place-items:center;font-size:23px}.search{margin:0 16px 14px;display:flex;align-items:center;gap:8px;background:var(--section-bg);border:1px solid var(--border);border-radius:14px;padding:11px 13px}.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font-size:14px}.hero{margin:0 16px 16px;border-radius:18px;padding:20px;background:linear-gradient(135deg,#1f6d4a,#2ca66f);color:#fff}.hero small{opacity:.85}.hero h2{margin:5px 0;font-size:24px}.card{position:relative;cursor:pointer}.card img{aspect-ratio:1/1.05}.fav{position:absolute;right:8px;top:8px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;z-index:2}.old-price{text-decoration:line-through;color:var(--hint);font-size:11px}.rating{font-size:12px;color:#c58a00}.detail-sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;overflow-y:auto}.detail-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}.back-btn{border:0;background:none;font-size:24px;color:var(--text)}.detail-content{padding-bottom:100px}.detail-gallery{background:var(--section-bg);padding:12px}.detail-gallery img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:14px;background:#f5f5f5}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:8px;border:2px solid transparent}.thumbs img.active{border-color:var(--accent)}.detail-info{padding:16px}.detail-name{font-size:21px;font-weight:750;line-height:1.25}.detail-price{font-size:24px;font-weight:800;color:var(--accent);margin-top:10px}.detail-old{font-size:13px;color:var(--hint);text-decoration:line-through;margin-top:3px}.detail-section{padding:0 16px;margin-top:20px}.detail-section h3{margin:0 0 10px;font-size:17px}.detail-desc{line-height:1.55;font-size:14px;color:var(--text);white-space:pre-line}.specs{background:var(--section-bg);border-radius:12px;overflow:hidden}.spec-row{display:flex;justify-content:space-between;gap:15px;padding:11px 13px;border-bottom:1px solid var(--border);font-size:13px}.spec-row:last-child{border-bottom:0}.spec-row span:first-child{color:var(--hint)}.detail-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 16px;z-index:3}.detail-add{width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:14px;font-size:16px;font-weight:750}.no-products{grid-column:1/-1}.
</style>
</head>
<body>
<header><div class="brand"><div class="brand-logo">🛍️</div><div><h1 style="margin:0">Mei Mei Times</h1><p>Samarqanddagi onlayn do‘kon</p></div></div></header>
<div class="search"><span>🔎</span><input id="searchInput" placeholder="Mahsulot qidiring..."></div>
<div class="hero"><small>MEI MEI TIMES</small><h2>Yangi mahsulotlar 🔥</h2><div>Kerakli mahsulotlarni qulay narxda toping</div></div>
<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>
<div class="cart-bar" id="cartBar"><span id="cartBarText">Savat</span><span id="cartBarTotal"></span></div>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="cartSheet"><button class="close-sheet" id="closeCart">✕</button><h2>Savat</h2><div id="cartLines"></div><div class="total-row"><span>Jami</span><span id="cartTotal">0 so‘m</span></div><button class="checkout-btn" id="goCheckout">Buyurtma berish</button></div>
<div class="sheet" id="checkoutSheet"><button class="close-sheet" id="closeCheckout">✕</button><h2>Yetkazib berish ma’lumotlari</h2><label>Ismingiz</label><input type="text" id="custName" placeholder="Ism Familiya"><label>Telefon raqam</label><input type="tel" id="custPhone" placeholder="+998 90 123 45 67"><label>Manzil</label><input type="text" id="custAddress" placeholder="Shahar, tuman, ko‘cha, uy"><label>To‘lov turi</label><div class="pay-options"><div class="pay-chip active" data-pay="naqd">Naqd</div><div class="pay-chip" data-pay="payme">Payme</div><div class="pay-chip" data-pay="click">Click</div></div><div class="total-row"><span>Jami</span><span id="checkoutTotal">0 so‘m</span></div><button class="checkout-btn" id="submitOrder">Buyurtmani tasdiqlash</button></div>
<div class="detail-sheet" id="detailSheet"><div class="detail-top"><button class="back-btn" id="detailBack">‹</button><b>Mahsulot</b><span style="width:28px"></span></div><div class="detail-content"><div class="detail-gallery"><img id="detailMainImg" src="" alt=""><div class="thumbs" id="detailThumbs"></div></div><div class="detail-info"><div class="detail-name" id="detailName"></div><div class="rating" id="detailRating"></div><div class="detail-price" id="detailPrice"></div><div class="detail-old" id="detailOld"></div></div><div class="detail-section"><h3>Mahsulot haqida</h3><div class="detail-desc" id="detailDesc"></div></div><div class="detail-section"><h3>Xususiyatlari</h3><div class="specs" id="detailSpecs"></div></div></div><div class="detail-bottom"><button class="detail-add" id="detailAdd">🛒 Savatga qo‘shish</button></div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}
const API_URL="https://telegramshop-production-a74b.up.railway.app";
let products=[],cart=JSON.parse(localStorage.getItem('cart')||'{}'),activeCategory='Barchasi',activePayment='naqd',currentProduct=null;
const $=id=>document.getElementById(id);
function saveCart(){localStorage.setItem('cart',JSON.stringify(cart));}
function money(n){return Number(n||0).toLocaleString('uz-UZ')+' so‘m';}
async function loadProducts(){try{const res=await fetch(API_URL+'/products');if(!res.ok)throw Error();products=await res.json();if(!Array.isArray(products))products=[];}catch(e){$('grid').innerHTML='<div class="empty no-products">⚠️ Mahsulotlarni yuklab bo‘lmadi.</div>';return;}renderCategories();renderGrid();updateCartBar();}
function renderCategories(){const cats=['Barchasi',...new Set(products.map(p=>p.category||'Umumiy'))];$('categories').innerHTML=cats.map(c=>`<div class="cat-chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</div>`).join('');document.querySelectorAll('.cat-chip').forEach(x=>x.onclick=()=>{activeCategory=x.dataset.cat;renderCategories();renderGrid();});}
function renderGrid(){const q=$('searchInput').value.trim().toLowerCase();let list=activeCategory==='Barchasi'?products:products.filter(p=>(p.category||'Umumiy')===activeCategory);if(q)list=list.filter(p=>String(p.name||'').toLowerCase().includes(q));if(!list.length){$('grid').innerHTML='<div class="empty no-products">🔎 Mahsulot topilmadi.</div>';return;}$('grid').innerHTML=list.map(p=>{const qty=cart[p.id]?.qty||0;const old=p.old_price??p.oldPrice;const rating=p.rating;return `<div class="card" data-id="${p.id}"><button class="fav" data-fav="${p.id}">♡</button><img src="${p.photo||''}" alt="${p.name||''}" loading="lazy"><div class="card-body"><div class="card-name">${p.name||''}</div>${rating?`<div class="rating">⭐ ${rating}`:''}</div><div class="card-price">${money(p.price)}</div>${old?`<div class="old-price">${money(old)}</div>`:''}<div class="card-actions">${qty===0?`<button class="add-btn" data-add="${p.id}">Savatga</button>`:`<div class="stepper"><button data-id="${p.id}" data-action="minus">−</button><span>${qty}</span><button data-id="${p.id}" data-action="plus">+</button></div>`}</div></div></div>`}).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.closest('.add-btn,.stepper,.fav'))return;openDetail(c.dataset.id);});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=e=>{e.stopPropagation();changeQty(b.dataset.add,1)});document.querySelectorAll('.stepper button').forEach(b=>b.onclick=e=>{e.stopPropagation();changeQty(b.dataset.id,b.dataset.action==='plus'?1:-1)});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.textContent=b.textContent==='♡'?'♥':'♡'});}
function changeQty(id,d){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const n=(cart[id]?.qty||0)+d;if(n<=0)delete cart[id];else cart[id]={qty:n,name:p.name,price:Number(p.price)||0};saveCart();renderGrid();updateCartBar();}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.qty*i.price,0)}function cartCount(){return Object.values(cart).reduce((s,i)=>s+i.qty,0)}function updateCartBar(){const n=cartCount();$('cartBar').style.display=n?'flex':'none';$('cartBarText').textContent=`Savat (${n})`;$('cartBarTotal').textContent=money(cartTotal());}
function openSheet(s){$('overlay').style.display='block';s.style.display='block'}function closeSheets(){$('overlay').style.display='none';$('cartSheet').style.display='none';$('checkoutSheet').style.display='none'}
$('overlay').onclick=closeSheets;$('cartBar').onclick=()=>{renderCartLines();openSheet($('cartSheet'))};$('closeCart').onclick=closeSheets;$('closeCheckout').onclick=closeSheets;
function renderCartLines(){$('cartLines').innerHTML=Object.entries(cart).map(([id,i])=>`<div class="cart-line"><div class="cart-line-name">${i.name} <span class="cart-line-price">x${i.qty}</span></div><div>${money(i.qty*i.price)}</div></div>`).join('');$('cartTotal').textContent=money(cartTotal())}
$('goCheckout').onclick=()=>{$('checkoutTotal').textContent=money(cartTotal());$('cartSheet').style.display='none';openSheet($('checkoutSheet'))};document.querySelectorAll('.pay-chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.pay-chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');activePayment=c.dataset.pay});
$('submitOrder').onclick=()=>{const name=$('custName').value.trim(),phone=$('custPhone').value.trim(),address=$('custAddress').value.trim();if(!name||!phone||!address)return alert('Iltimos, barcha maydonlarni to‘ldiring.');if(!cartCount())return alert('Savat bo‘sh.');const payload={items:Object.values(cart),customer:{name,phone,address},payment:activePayment,total:cartTotal()};if(tg){tg.sendData(JSON.stringify(payload));cart={};saveCart();updateCartBar();closeSheets();}else alert('Bu sahifa faqat Telegram ichida ishlaydi.')};
function openDetail(id){currentProduct=products.find(p=>String(p.id)===String(id));if(!currentProduct)return;const p=currentProduct;const imgs=Array.isArray(p.photos)&&p.photos.length?p.photos:(p.photo?[p.photo]:[]);$('detailMainImg').src=imgs[0]||'';$('detailName').textContent=p.name||'';$('detailPrice').textContent=money(p.price);$('detailOld').textContent=p.old_price||p.oldPrice?money(p.old_price??p.oldPrice):'';$('detailRating').textContent=p.rating?`⭐ ${p.rating} ${p.reviews?`• ${p.reviews} ta sharh`:''}`:'';$('detailDesc').textContent=p.long_desc||p.description||p.desc||'Mahsulot haqida batafsil ma’lumot tez orada qo‘shiladi.';const specs=p.specs||p.characteristics||{};$('detailSpecs').innerHTML=Object.keys(specs).length?Object.entries(specs).map(([k,v])=>`<div class="spec-row"><span>${k}</span><b>${v}</b></div>`).join(''):'<div class="spec-row"><span>Kategoriya</span><b>'+ (p.category||'Umumiy') +'</b></div>';$('detailThumbs').innerHTML=imgs.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" data-img="${im}">`).join('');document.querySelectorAll('#detailThumbs img').forEach(t=>t.onclick=()=>{$('detailMainImg').src=t.dataset.img;document.querySelectorAll('#detailThumbs img').forEach(x=>x.classList.remove('active'));t.classList.add('active')});$('detailSheet').style.display='block';document.body.style.overflow='hidden'}
$('detailBack').onclick=()=>{$('detailSheet').style.display='none';document.body.style.overflow=''};$('detailAdd').onclick=()=>{if(currentProduct){changeQty(currentProduct.id,1);$('detailAdd').textContent='✓ Savatga qo‘shildi';setTimeout(()=>$('detailAdd').textContent='🛒 Savatga qo‘shish',1000)}};$('searchInput').oninput=renderGrid;loadProducts();
</script>
</body>
</html>
